# Local development infrastructure.
#   docker compose up -d            -> PostgreSQL only (run the API from Rider / dotnet run)
#   docker compose --profile api up -d --build  -> PostgreSQL + containerised API
name: skyjourney

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skyjourney}
      POSTGRES_USER: ${POSTGRES_USER:-skyjourney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyjourney_dev_password}
    ports:
      # 5432 is frequently taken on developer machines; override with POSTGRES_PORT.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - skyjourney-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skyjourney-pgdata:
